function validPhone(v) {
  if (!v || v.length !== 11) return false;
  if (v[0] !== "0" || v[1] !== "9") return false;
  for (var i = 0; i < v.length; i++) { if (v[i] < "0" || v[i] > "9") return false; }
  return true;
}
function validEmail(v) { return v && v.indexOf("@") > 0 && v.indexOf(".") > 0; }
function validPostal(v) {
  if (!v || v.length !== 10) return false;
  for (var i = 0; i < v.length; i++) { if (v[i] < "0" || v[i] > "9") return false; }
  return true;
}
function allSameDigits(v) {
  if (!v || v.length < 2) return false;
  var f = v[0];
  for (var i = 1; i < v.length; i++) { if (v[i] !== f) return false; }
  return true;
}
function fakePhone(v) { return v && v.length === 11 && allSameDigits(v.slice(2)); }

function renderSteps() {
  var h = "";
  for (var i = 0; i < STEPS.length; i++) {
    var cls = i < curStep ? "done" : i === curStep ? "active" : "pending";
    h += '<div class="step"><div class="sdot ' + cls + '">' + (i < curStep ? "&#10003;" : (i+1)) + '</div>';
    h += '<span class="slbl ' + cls + '">' + STEPS[i] + '</span>';
    if (i < STEPS.length - 1) h += '<div class="sline ' + (i < curStep ? "done" : "pending") + '"></div>';
    h += '</div>';
  }
  document.getElementById("stepsBar").innerHTML = h;
  document.getElementById("stepInd").textContent = "مرحله " + (curStep+1) + " از " + STEPS.length;
  document.getElementById("btnPrev").style.display = curStep === 0 ? "none" : "block";
  document.getElementById("navBar").style.display = curStep === STEPS.length - 1 ? "none" : "flex";
}

function fillYears(selId, from, to) {
  var sel = document.getElementById(selId);
  if (!sel) return;
  for (var y = to; y >= from; y--) {
    var opt = document.createElement("option");
    opt.value = String(y);
    opt.textContent = String(y);
    sel.appendChild(opt);
  }
}
function fillDays(selId, count) {
  var sel = document.getElementById(selId);
  if (!sel) return;
  var cur = sel.value;
  while (sel.options.length > 1) sel.remove(1);
  for (var d = 1; d <= count; d++) {
    var opt = document.createElement("option");
    var v = d < 10 ? "0" + d : String(d);
    opt.value = v; opt.textContent = String(d);
    sel.appendChild(opt);
  }
  sel.value = cur;
}
function updateBdate() {
  var m = document.getElementById("f_bdate_m");
  var mval = m ? parseInt(m.value) : 0;
  var days = (mval >= 1 && mval <= 6) ? 31 : (mval >= 7 && mval <= 11) ? 30 : mval === 12 ? 29 : 31;
  fillDays("f_bdate_d", days);
  var y = document.getElementById("f_bdate_y") ? document.getElementById("f_bdate_y").value : "";
  var mv = document.getElementById("f_bdate_m") ? document.getElementById("f_bdate_m").value : "";
  var dv = document.getElementById("f_bdate_d") ? document.getElementById("f_bdate_d").value : "";
  var hi = document.getElementById("f_bdate");
  if (hi) hi.value = y && mv && dv ? y + "/" + mv + "/" + dv : "";
}
function updMbd(i) {
  var m = document.getElementById("mbdm" + i);
  var mval = m ? parseInt(m.value) : 0;
  var days = (mval >= 1 && mval <= 6) ? 31 : (mval >= 7 && mval <= 11) ? 30 : mval === 12 ? 29 : 31;
  fillDays("mbdd" + i, days);
  var y = document.getElementById("mbdy" + i) ? document.getElementById("mbdy" + i).value : "";
  var mv = document.getElementById("mbdm" + i) ? document.getElementById("mbdm" + i).value : "";
  var dv = document.getElementById("mbdd" + i) ? document.getElementById("mbdd" + i).value : "";
  var hi = document.getElementById("mbd" + i);
  if (hi) hi.value = y && mv && dv ? y + "/" + mv + "/" + dv : "";
}

function pickType(el, t) {
  document.querySelectorAll(".tcard").forEach(function(x){ x.classList.remove("sel"); });

function step1(c) {

function rmMb(i) { var el = document.getElementById("mb" + i); if(el) el.remove(); }
function mFile(input, i) { if(input.files[0]) document.getElementById("mfm" + i).textContent = "✅ " + input.files[0].name; }

function chkMN(input, i) {
  var val = input.value.trim();
  var msg = document.getElementById("mnmsg" + i);
  if (!val) { msg.textContent = ""; input.className = ""; return; }
  var ok = val.length === 10;
  if (ok) { for (var j = 0; j < val.length; j++) { if (val[j] < "0" || val[j] > "9") { ok = false; break; } } }
  if (!ok) { msg.textContent = "کد ملی باید 10 رقم باشد"; msg.className = "emsg"; input.className = "ei"; return; }
  var all = [];
  document.querySelectorAll('[id^="mnat"]').forEach(function(el) { if(el.value && el.value.length === 10) all.push(el.value); });
  var cnt = 0; for(var k=0;k<all.length;k++){if(all[k]===val)cnt++;}
  if (cnt > 1) { msg.textContent = "⚠️ این کد ملی تکرار شده!"; msg.className = "emsg"; input.className = "ei"; return; }
  if (regData.nats.indexOf(val) >= 0) { msg.textContent = "🚫 قبلا ثبت شده - امکان ثبت‌نام مجدد ندارید"; msg.className = "emsg"; input.className = "ei"; return; }
  msg.textContent = "✅ معتبر"; msg.className = "omsg"; input.className = "oi";
}

function chkNat(input) {
  var val = input.value.trim();
  var msg = document.getElementById("natmsg");
  if (!msg) return;
  var len = selType === "real" ? 10 : 11;
  if (!val) { msg.textContent = ""; input.className = ""; return; }
  var ok = val.length === len;
  if (ok) { for(var j=0;j<val.length;j++){if(val[j]<"0"||val[j]>"9"){ok=false;break;}} }
  if (!ok) { msg.textContent = "باید " + len + " رقم باشد"; msg.className = "emsg"; input.className = "ei"; return; }
  if (regData.nats.indexOf(val) >= 0) { msg.textContent = "🚫 قبلاً ثبت شده - ثبت‌نام مجدد ممنوع"; msg.className = "emsg"; input.className = "ei"; return; }
  msg.textContent = "✅ معتبر - نیاز به تایید مدیر"; msg.className = "omsg"; input.className = "oi";
}

function chkPhone(input) {
  var val = input.value.trim();
  var msg = document.getElementById("phonemsg");
  if (!val) { msg.textContent = ""; input.className = ""; return; }
  if (!validPhone(val)) { msg.textContent = "فرمت: 09xxxxxxxxx"; msg.className = "emsg"; input.className = "ei"; return; }
  if (fakePhone(val)) { msg.textContent = "⚠️ شماره ساختگی قابل قبول نیست"; msg.className = "emsg"; input.className = "ei"; return; }
  if (regData.phones.indexOf(val) >= 0) { msg.textContent = "🚫 این شماره قبلاً ثبت شده"; msg.className = "emsg"; input.className = "ei"; return; }
  msg.textContent = "✅ معتبر"; msg.className = "omsg"; input.className = "oi";
}

function chkEmail(input) {

function chkPostal(input) {

      {id:"d2",lbl:"سند یا اجاره‌نامه",req:false,dt:"سند",ai:false,sig:false},
      {id:"d3",lbl:"گواهینامه صنفی",req:false,dt:"گواهینامه",ai:false,sig:false}
    ];
  } else {
    docs = [
      {id:"d0",lbl:"اساسنامه / Articles of Association",req:true,dt:"اساسنامه",ai:true,sig:false},
      {id:"d1",lbl:"گواهی ثبت / Registration Certificate",req:true,dt:"گواهی ثبت",ai:false,sig:false},
      {id:"d2",lbl:"مجوز فعالیت / Business License",req:true,dt:"مجوز",ai:false,sig:false},
      {id:"d3",lbl:"ترجمه رسمی / Official Translation",req:false,dt:"ترجمه",ai:false,sig:false}
    ];
  }
  var h = '<div class="card"><div class="card-hdr" style="background:linear-gradient(135deg,#667eea,#764ba2)">&#128206; بارگذاری اسناد</div><div class="card-body">';
  for (var di = 0; di < docs.length; di++) {
    var d = docs[di];
    h += '<div class="ditem"><div class="dlbl">' + (d.req ? '<span class="req">*</span>' : '') + d.lbl;
    if (d.ai) h += ' <span style="background:#ede9fe;color:#6d28d9;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:900">&#129302; هوشمند</span>';
    if (d.sig) h += ' <span style="background:#d1fae5;color:#065f46;border-radius:6px;padding:2px 8px;font-size:10px;font-weight:900">✍️ امضا</span>';
    h += '</div><label class="dup"><input type="file" style="display:none" accept=".pdf,.jpg,.jpeg,.png" data-dt="' + d.dt + '" data-di="' + d.id + '" data-ai="' + (d.ai?"1":"0") + '" data-sig="' + (d.sig?"1":"0") + '" onchange="docUp(this)">&#128206; <span style="text-decoration:underline;color:#6366f1">کلیک کنید</span></label>';
    h += '<div class="dsts" id="dsts' + d.id + '"></div></div>';
  }
  h += '</div></div>';
  c.innerHTML = h;
}

function docUp(input) {
  var dt = input.getAttribute("data-dt");
  var di = input.getAttribute("data-di");
  var isAI = input.getAttribute("data-ai") === "1";
  var isSig = input.getAttribute("data-sig") === "1";
  var el = document.getElementById("dsts" + di);
  if (!input.files[0]) return;
  var fname = input.files[0].name;
  var fsize = input.files[0].size;

  if (isSig) {
    el.textContent = "🔍 در حال تشخیص امضا...";
    el.className = "dsts chk";
    setTimeout(function() {
      if (fsize > 3000) {
        el.textContent = "✅ امضا شناسایی شد: " + fname;
        el.className = "dsts ok";
      } else {
        el.textContent = "❌ امضا شناسایی نشد - تصویر واضح‌تر آپلود کنید";
        el.className = "dsts err";
        input.value = "";
      }
    }, 1500);
    return;
  }

  if (isAI) {
    el.textContent = "🤖 در حال تحلیل سند...";
    el.className = "dsts chk";
    var reader = new FileReader();
    reader.onload = function(ev) {
      var b64 = ev.target.result.split(",")[1];
      var mt = input.files[0].type || "image/jpeg";
      fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          model: "claude-sonnet-4-20250514",
          max_tokens: 80,
          messages: [{role: "user", content: [
            {type: "image", source: {type: "base64", media_type: mt, data: b64}},
            {type: "text", text: "نوع سند مورد انتظار: " + dt + ". آیا این سند با نوع مورد انتظار مطابقت دارد؟ فقط بله یا خیر و یک جمله."}
          ]}]
        })
      }).then(function(r){ return r.json(); }).then(function(data) {
        var txt = data.content && data.content[0] ? data.content[0].text : "";
        var no = txt.indexOf("خیر") === 0 || txt.indexOf("نه") === 0;
        if (no) {
          el.textContent = "⚠️ سند اشتباه: " + txt;
          el.className = "dsts err";
          input.value = "";
        } else {
          el.textContent = "✅ تایید شد: " + fname;
          el.className = "dsts ok";
        }
      }).catch(function() {
        el.textContent = "✅ بارگذاری شد (بررسی دستی): " + fname;
        el.className = "dsts ok";
      });
    };
    reader.readAsDataURL(input.files[0]);
    return;
  }
  el.textContent = "✅ بارگذاری شد: " + fname;
  el.className = "dsts ok";
}

function step4(c) {
  var keys = Object.keys(ACTS);
  var cnt = Object.keys(selActs).length;
  var h = '<div class="card"><div class="card-hdr" style="background:linear-gradient(135deg,#43e97b,#38f9d7);color:#065f46">&#127981; حوزه‌های فعالیت (حداکثر 2)</div><div class="card-body">';
  h += '<div style="font-size:13px;font-weight:900;color:#6366f1;margin-bottom:14px">انتخابی: ' + cnt + ' از 2</div><div class="agrid">';
  for (var ki = 0; ki < keys.length; ki++) {
    var k = keys[ki];
    var a = ACTS[k];
    var isSel = !!selActs[k];
    var isDis = cnt >= 2 && !isSel;
    var onclick = isDis ? "actLimit()" : "openSub('" + k + "')";
    h += '<div class="aitem' + (isSel?" sel":"") + (isDis?" dis":"") + '" onclick="' + onclick + '">';
    h += '<div class="aicon">' + a.icon + '</div><div class="aname">' + k + '</div>';
    if (isSel) h += '<div style="font-size:10px;color:#6366f1;margin-top:4px">' + selActs[k].length + ' مورد</div>';
    h += '</div>';
  }
  h += '</div></div></div>';
  c.innerHTML = h;
}

function actLimit() { alert("حداکثر 2 حوزه قابل انتخاب است."); }

function openSub(key) {
  pendingKey = key;
  var a = ACTS[key];
  var cur = selActs[key] || [];
  var cnt = cur.length;
  var h = '<div style="text-align:center;font-size:13px;font-weight:900;color:#6366f1;margin-bottom:12px">انتخابی: ' + cnt + ' از 10</div><div class="sgrid">';
  for (var si = 0; si < a.subs.length; si++) {
    var s = a.subs[si];
    var isSel = cur.indexOf(s) >= 0;
    var isDis = cnt >= 10 && !isSel;
    var safe = s.replace(/\\/g,"\\\\").replace(/'/g,"\\'");
    var oc = isDis ? "subLimit()" : "togSub('" + safe + "')";
    h += '<div class="sitem' + (isSel?" sel":"") + (isDis?" dis":"") + '" onclick="' + oc + '">' + s + '</div>';
  }
  h += '</div><div style="text-align:center;margin-top:16px"><button class="btnp" onclick="confirmSub()">&#10003; تایید</button></div>';
  document.getElementById("subModalTitle").textContent = a.icon + " " + key;
  document.getElementById("subModalBody").innerHTML = h;
  document.getElementById("subModal").classList.add("show");
}

function subLimit() { alert("حداکثر 10 زیرشاخه قابل انتخاب است."); }

function togSub(s) {
  if (!selActs[pendingKey]) selActs[pendingKey] = [];
  var idx = selActs[pendingKey].indexOf(s);
  if (idx >= 0) selActs[pendingKey].splice(idx, 1);
  else if (selActs[pendingKey].length < 10) selActs[pendingKey].push(s);
  if (selActs[pendingKey].length === 0) delete selActs[pendingKey];
  openSub(pendingKey);
}

function confirmSub() { closeSubModal(); step4(document.getElementById("mainArea")); }
function closeSubModal() { document.getElementById("subModal").classList.remove("show"); }

function step5(c) {
  document.getElementById("navBar").style.display = "none";
  var h = '<div class="card"><div class="card-hdr" style="background:linear-gradient(135deg,#fa709a,#fee140)">&#128242; تکمیل ثبت‌نام</div><div class="card-body"><div style="text-align:center;padding:20px">';
  h += '<div style="font-size:60px;margin-bottom:14px">&#128242;</div>';
  h += '<div style="font-size:18px;font-weight:900;color:#1f2937;margin-bottom:8px">تایید شماره موبایل</div>';
  h += '<div style="font-size:13px;color:#6b7280;font-weight:700;margin-bottom:20px;line-height:1.7">شماره موبایل خود را وارد کنید<br>کد 6 رقمی ارسال خواهد شد</div>';
  h += '<div class="pwrap"><span class="pcc">+98</span><input class="pinp" id="otpPhone" placeholder="09xxxxxxxxx" maxlength="11"></div>';
  h += '<button class="btnp" id="sendBtn" onclick="sendOTP()">ارسال کد تایید</button>';
  h += '<div id="otpArea" style="display:none;margin-top:20px">';
  h += '<div style="font-size:13px;font-weight:900;color:#374151;margin-bottom:10px">کد 6 رقمی:</div>';
  h += '<div class="otprow"><input class="otpi" maxlength="1" oninput="otpMv(this,0)"><input class="otpi" maxlength="1" oninput="otpMv(this,1)"><input class="otpi" maxlength="1" oninput="otpMv(this,2)"><input class="otpi" maxlength="1" oninput="otpMv(this,3)"><input class="otpi" maxlength="1" oninput="otpMv(this,4)"><input class="otpi" maxlength="1" oninput="otpMv(this,5)"></div>';
  h += '<button class="btnp" onclick="verOTP()">&#10003; تایید و ثبت نهایی</button>';
  h += '<div style="font-size:12px;color:#9ca3af;font-weight:700;margin-top:10px">نرسید؟ <span style="color:#6366f1;cursor:pointer;font-weight:900;text-decoration:underline" onclick="sendOTP()">ارسال مجدد</span></div>';
  h += '</div></div></div></div>';
  h += '<div style="text-align:center;margin-top:12px"><button class="btns" onclick="backOTP()">&#9664; مرحله قبل</button></div>';
  c.innerHTML = h;
}

function backOTP() { curStep = 4; document.getElementById("navBar").style.display = "flex"; renderStep(); }

function sendOTP() {
  var p = document.getElementById("otpPhone").value;
  if (!validPhone(p)) { alert("شماره را صحیح وارد کنید"); return; }
  document.getElementById("otpArea").style.display = "block";
  document.getElementById("sendBtn").textContent = "ارسال مجدد";
  alert("کد به " + p + " ارسال شد\n(دمو: 123456)");
}

function otpMv(el, idx) { if(el.value) { var a = document.querySelectorAll(".otpi"); if(idx < 5) a[idx+1].focus(); } }

function verOTP() {
  var a = document.querySelectorAll(".otpi");
  var code = "";
  a.forEach(function(i){ code += i.value; });
  if (code.length < 6) { alert("کد کامل را وارد کنید"); return; }
  finalReg();
}

async function finalReg() {
  var nat = document.getElementById("f_natid") ? document.getElementById("f_natid").value : "";
  var post = document.getElementById("f_postal") ? document.getElementById("f_postal").value : "";
  var mob = document.getElementById("f_mobile") ? document.getElementById("f_mobile").value : "";
  var em = document.getElementById("f_email") ? document.getElementById("f_email").value.toLowerCase() : "";
  var name = document.getElementById("f_name") ? document.getElementById("f_name").value : (document.getElementById("f_fname") ? document.getElementById("f_fname").value + " " + (document.getElementById("f_lname") ? document.getElementById("f_lname").value : "") : "");
  var addr = document.getElementById("f_address") ? document.getElementById("f_address").value : "";
  var prov = document.getElementById("f_loc") ? document.getElementById("f_loc").value : "";
  var reg = document.getElementById("f_reg") ? document.getElementById("f_reg").value : "";
  var eco = document.getElementById("f_eco") ? document.getElementById("f_eco").value : "";
  var bank = document.getElementById("f_bank") ? document.getElementById("f_bank").value : "";
  var account = document.getElementById("f_account") ? document.getElementById("f_account").value : "";
  var sheba = document.getElementById("f_sheba") ? document.getElementById("f_sheba").value : "";
  var year = document.getElementById("f_year") ? document.getElementById("f_year").value : "";
  var rank = document.getElementById("f_rank") ? document.getElementById("f_rank").value : "";
  var iso = document.getElementById("f_iso") ? document.getElementById("f_iso").value : "";
  var trk = "PGFH-" + Math.floor(100000 + Math.random() * 900000);

  // Save to Supabase
  if (sb) {
    try {
      var suppData = {
        id: trk,
        name: name.trim() || "نامشخص",
        type: selType,
        phone: mob,
        email: em,
        address: addr,
        postal_code: post,
        nat_id: nat,
        reg_no: reg,
        eco_id: eco,
        bank_name: bank,
        bank_account: account,
        sheba: sheba,
        founded_year: year,
        rank: rank,
        iso: iso,
        activities: JSON.stringify(selActs),
        status: "pending",
        is_blacklist: false
      };
      var res = await sb.from("suppliers").insert(suppData);
      if (res.error) console.error("Supabase error:", res.error);

      // Save members
      var mnatEls = document.querySelectorAll('[id^="mnat"]');
      for (var mi = 0; mi < mnatEls.length; mi++) {
        var idx = mnatEls[mi].id.replace("mnat","");
        var mname = document.getElementById("mn"+idx) ? document.getElementById("mn"+idx).value : "";
        var mlname = document.getElementById("ml"+idx) ? document.getElementById("ml"+idx).value : "";
        var mnat = mnatEls[mi].value;
        var mrole = [];
        if (document.getElementById("mceo"+idx) && document.getElementById("mceo"+idx).checked) mrole.push("مدیرعامل");
        if (document.getElementById("mbrd"+idx) && document.getElementById("mbrd"+idx).checked) mrole.push("هیئت مدیره");
        if (mname) {
          await sb.from("supplier_members").insert({
            supplier_id: trk,
            name: mname,
            lastname: mlname,
            national_code: mnat,
            role: mrole.join(" - ")
          });
        }
      }

      // Save to regData
      if (nat) regData.nats.push(nat);
      if (post) regData.posts.push(post);
      if (mob) regData.phones.push(mob);
      if (em) regData.emails.push(em);
      saveReg();

    } catch(e) { console.error("Save error:", e); }
  }

  document.getElementById("navBar").style.display = "none";
  document.getElementById("mainArea").innerHTML = '<div class="card"><div class="card-hdr" style="background:linear-gradient(135deg,#43e97b,#38f9d7);color:#065f46">&#10003; ثبت‌نام موفق</div><div class="card-body"><div style="text-align:center;padding:30px"><div style="width:80px;height:80px;background:linear-gradient(135deg,#43e97b,#38f9d7);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px;margin:0 auto 20px">&#10003;</div><div style="font-size:20px;font-weight:900;color:#065f46;margin-bottom:8px">ثبت‌نام موفق!</div><div style="font-size:13px;color:#6b7280;font-weight:700;line-height:1.8;margin-bottom:20px">اطلاعات شما ثبت و در صف بررسی قرار گرفت<br>نتیجه از طریق پیامک اطلاع داده خواهد شد</div><div style="background:linear-gradient(135deg,#f0fdf4,#dcfce7);border:2px solid #86efac;border-radius:12px;padding:16px;max-width:280px;margin:0 auto"><div style="font-size:12px;color:#6b7280;font-weight:800;margin-bottom:6px">کد پیگیری</div><div style="font-size:24px;font-weight:900;color:#065f46;letter-spacing:2px">' + trk + '</div></div></div></div></div>';
  document.getElementById("stepsBar").innerHTML = "";
}

function nextStep() {
  if (curStep === 0 && !selType) { alert("نوع متقاضی را انتخاب کنید"); return; }
  if (curStep === 1) {
    var mobEl = document.getElementById("f_mobile");
    var emEl = document.getElementById("f_email");
    var postEl = document.getElementById("f_postal");
    var mob = mobEl ? mobEl.value.trim() : "";
    var em = emEl ? emEl.value.trim() : "";
    var post = postEl ? postEl.value.trim() : "";
    if (mob && !validPhone(mob)) { alert("شماره موبایل معتبر وارد کنید (09xxxxxxxxx)"); return; }
    if (mob && fakePhone(mob)) { alert("شماره موبایل ساختگی قابل قبول نیست"); return; }
    if (mob && regData.phones.indexOf(mob) >= 0) { alert("این شماره قبلاً ثبت شده"); return; }
    if (em && !validEmail(em)) { alert("فرمت ایمیل صحیح نیست"); return; }
    if (em && regData.emails.indexOf(em.toLowerCase()) >= 0) { alert("این ایمیل قبلاً ثبت شده"); return; }
    if (post && !validPostal(post)) { alert("کد پستی باید 10 رقم باشد"); return; }
    if (post && allSameDigits(post)) { alert("کد پستی تکراری/ساختگی قابل قبول نیست"); return; }
    if (post && regData.posts.indexOf(post) >= 0) { alert("این کد پستی قبلاً ثبت شده"); return; }
  }
  if (curStep === 4 && Object.keys(selActs).length === 0) { alert("حداقل یک حوزه انتخاب کنید"); return; }
  if (curStep < STEPS.length - 1) { curStep++; renderStep(); }
}

function prevStep() { if (curStep > 0) { curStep--; renderStep(); } }

renderStep();
</script>
